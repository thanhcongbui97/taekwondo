<script>
    var yourName        = document.getElementById("searchInput1");
    var crushName       = document.getElementById("searchInput2");

    var id;
    var memberXML = new Document;
    var memberArray = new Array();
    var xget = new XMLHttpRequest();
	xget.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
        memberXML = this.responseXML;
        memberArray = createMemberArray(memberXML);
        autocomplete(searchInput1, memberArray);
        autocomplete(searchInput2, memberArray);
        }
    };
    xget.open("GET", "members.xml", true);
    xget.send();

    function frame() {
        if(width >= 1000){
            hh.innerHTML = 'Xong !';
            var ratio = parseInt(Math.random()*100);
            alert("Xác suất để " + yourName.value + " và " + crushName.value +" yêu nhau là " + ratio + "%" );
            clearInterval(id);
        } else {
            width += 3;
            myBar.style.width = width/10 + '%';
            myBar.innerHTML = parseInt(width/10) + '%';
            if(width < 300){
                hh.innerHTML = 'Đang lấy thông tin';
            } else if(width < 600){
                width += 3;
                hh.innerHTML = 'Đang phân tích dữ liệu';
            } else if(width < 900){
                width += 5;
                hh.innerHTML = 'Đang tính toán';
            } else{
                width += 4;
                hh.innerHTML = 'Đang tải kết quả';
            }
        }
    }

    function autocomplete(inp, arr) {
        var currentFocus;
        inp.addEventListener("input", function(e) {
            var a, b, i, val = this.value;
            closeAllLists();
            if (!val) { return false;}
            currentFocus = -1;
            a = document.createElement("DIV");
            a.setAttribute("id", this.id + "autocomplete-list");
            a.setAttribute("class", "autocomplete-items");
            this.parentNode.appendChild(a);
            for (i = 0; i < arr.length; i++) {
                if (normalizeString(arr[i]).includes(normalizeString(val))) {
                    var index = normalizeString(arr[i]).indexOf(normalizeString(val));
                    b = document.createElement("DIV");
                    b.innerHTML = arr[i].substr(0, index);
                    b.innerHTML += "<strong>" + arr[i].substr(index, val.length) + "</strong>";
                    b.innerHTML += arr[i].substr(index + val.length);
                    b.innerHTML += "<input type='hidden' value='" + arr[i] + "'>";
                    b.addEventListener("click", function(e) {
                        inp.value = this.getElementsByTagName("input")[0].value;
                        closeAllLists();
                        // searchButton.click();
                    });
                    a.appendChild(b);
                }
            }
        });

        inp.addEventListener("keydown", function(e) {
            var x = document.getElementById(this.id + "autocomplete-list");
            if (x) x = x.getElementsByTagName("div");
            if (e.keyCode == 40) {
                currentFocus++;
                addActive(x);
            } else if (e.keyCode == 38) { 
                currentFocus--;
                addActive(x);
            } else if (e.keyCode == 13) {
                e.preventDefault();
                if (currentFocus > -1) {
                    if (x) x[currentFocus].click();
                }
            }
        });

        function addActive(x) {
            if (!x) return false;
            removeActive(x);
            if (currentFocus >= x.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (x.length - 1);
            x[currentFocus].classList.add("autocomplete-active");
        }

        function removeActive(x) {
            for (var i = 0; i < x.length; i++) {
                x[i].classList.remove("autocomplete-active");
            }
        }

        function closeAllLists(elmnt) {
            var x = document.getElementsByClassName("autocomplete-items");
            for (var i = 0; i < x.length; i++) {
                if (elmnt != x[i] && elmnt != inp) {
                    x[i].parentNode.removeChild(x[i]);
                }
            }
        }
        
        document.addEventListener("click", function (e) {
        closeAllLists(e.target);
    });
  }

    function normalizeString(str) {
        return nonAccentVietnamese(str).toUpperCase();
    }

    function nonAccentVietnamese(str) {
        str = str.toLowerCase();
        //     We can also use this instead of from line 11 to line 17
        //     str = str.replace(/\u00E0|\u00E1|\u1EA1|\u1EA3|\u00E3|\u00E2|\u1EA7|\u1EA5|\u1EAD|\u1EA9|\u1EAB|\u0103|\u1EB1|\u1EAF|\u1EB7|\u1EB3|\u1EB5/g, "a");
        //     str = str.replace(/\u00E8|\u00E9|\u1EB9|\u1EBB|\u1EBD|\u00EA|\u1EC1|\u1EBF|\u1EC7|\u1EC3|\u1EC5/g, "e");
        //     str = str.replace(/\u00EC|\u00ED|\u1ECB|\u1EC9|\u0129/g, "i");
        //     str = str.replace(/\u00F2|\u00F3|\u1ECD|\u1ECF|\u00F5|\u00F4|\u1ED3|\u1ED1|\u1ED9|\u1ED5|\u1ED7|\u01A1|\u1EDD|\u1EDB|\u1EE3|\u1EDF|\u1EE1/g, "o");
        //     str = str.replace(/\u00F9|\u00FA|\u1EE5|\u1EE7|\u0169|\u01B0|\u1EEB|\u1EE9|\u1EF1|\u1EED|\u1EEF/g, "u");
        //     str = str.replace(/\u1EF3|\u00FD|\u1EF5|\u1EF7|\u1EF9/g, "y");
        //     str = str.replace(/\u0111/g, "d");
        str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
        str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
        str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
        str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
        str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
        str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
        str = str.replace(/đ/g, "d");
        // Some system encode vietnamese combining accent as individual utf-8 characters
        str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, ""); // Huyền sắc hỏi ngã nặng 
        str = str.replace(/\u02C6|\u0306|\u031B/g, ""); // Â, Ê, Ă, Ơ, Ư
        return str;
    }

    function createMemberArray(xmlDoc) {
        var Table = xmlDoc.getElementsByTagName("Table")[0];
        var arrayResult = [];
        for (let i = 1; i < Table.getElementsByTagName("Row").length; i++) {
            var name = getXML(xmlDoc, i, 1, 0);
            if (name == "") {
                break;
            }
            arrayResult.push(name);
        }
        return arrayResult;
    }

	function getPassword(xmlDoc) {
		var Table = xmlDoc.getElementsByTagName("DocumentProperties")[0];
		var Data  = Table.getElementsByTagName("Password")[0];
		var res = Data.childNodes[0];
		return res.nodeValue;
	}

	function getXML(xmlDoc, x, y, z) {
		var Table = xmlDoc.getElementsByTagName("Table")[0];
		var Row  = Table.getElementsByTagName("Row")[x];
		if (Row.getElementsByTagName("Cell").length < 2 ) {
			return "";
		}
		var Cell = Row.getElementsByTagName("Cell")[y];
		var Data = Cell.getElementsByTagName("Data")[z];
		var res = Data.childNodes[0];
		return res.nodeValue;
	}

    function strCaseCmp(a, b) {
        return typeof a === 'string' && typeof b === 'string'
            ? a.localeCompare(b, undefined, { sensitivity: 'accent' }) === 0
            : a === b;
    }

    searchButton.addEventListener("click", function (event) {
        if (yourName.value == "" || crushName.value == "") {
            document.getElementById("hh").innerHTML = "Vui lòng nhập đầy đủ họ tên";

            for (i = 0; i < memberArray.length; i++) {
                if (normalizeString(memberArray[i]).includes(normalizeString(crushName.value))) {

                }
            }
            if (isInMember == false) {

            } else {
                Result.innerHTML = "";
            }
            clearInterval(id);
            width = 0;
            id = setInterval(frame , 50);
        }
	});
