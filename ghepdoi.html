
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <link rel="shortcut icon" href="favicon.ico">
    <title>Ghép đôi - Taekwondo PTIT</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Bootstrap core CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Design Bootstrap -->
    <link href="css/mdb.min.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        .autocomplete-items {
            position: absolute;
            border: 1px solid #ddd;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }
        .autocomplete-items div:hover {
            background-color: #e9ecef;
        }
        .autocomplete-active {
            background-color: #33b5e5 !important;
            color: #ffffff;
        }
        .progress-wrapper {
            margin-top: 20px;
            text-align: center;
        }
        #progress {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            height: 24px;
            margin-top: 8px;
        }
        #bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #33b5e5, #20c997);
            color: white;
            text-align: center;
            line-height: 24px;
            font-size: 0.85rem;
            transition: width 0.05s linear;
        }
        #hh {
            font-weight: 500;
            color: #555;
            min-height: 1.5em;
        }
        #Result {
            margin-top: 16px;
            font-size: 1.1rem;
            text-align: center;
        }
        .ratio-display {
            font-size: 3rem;
            font-weight: bold;
            color: #e91e63;
            margin: 16px 0;
        }
    </style>
</head>

<body>
  <!--Main Navigation-->
  <my-header></my-header>
  <!--Main Navigation-->

  <!--Main layout-->
  <main class="mt-5">
      <div class="container">

          <!--Section: Ghép đôi-->
          <section id="ghepdoi">
              <!--Section: Ghép đôi-->
              <section id="Ghép đôi" class="text-center">
                  <i class="fa fa-heart fa-3x red-text"></i>
                  <!-- Heading -->
                  <h2 class="mb-5 font-weight-bold text-center">Ghép đôi</h2>
                  <!--Grid row-->
                  <div class="row d-flex justify-content-center mb-4">
                      <!--Grid column-->
                      <div class="col-md-8">
                          <!-- Description -->
                          <p><strong>Bạn có crush ai không, cùng thử xem 2 bạn có hợp nhau không nhé!</strong>
                          </p>
                      </div>
              </section>
          </section>

          <hr class="my-5">

          <!--Search inputs (MDB style, matching thanhvien.html)-->
          <section>
              <!--Section: Examples-->
              <!--Section: Examples-->
              <section id="examples" class="text-center">
              </section>
              <!--Section: Examples-->
              <!--Section: Examples-->
              <div class="row">
                  <div class="col-lg-3 col-md-12"></div>
                  <div class="col-lg-6 col-md-12">
                      <div class="md-form form-sm">
                          <i class="fa fa-user prefix grey-text"></i>
                          <input type="text" id="searchInput1" class="form-control form-control-sm" autocomplete="off">
                          <label for="searchInput1">Nhập tên của bạn</label>
                      </div>
                      <div class="md-form form-sm">
                          <i class="fa fa-heart prefix grey-text"></i>
                          <input type="text" id="searchInput2" class="form-control form-control-sm" autocomplete="off">
                          <label for="searchInput2">Nhập tên crush của bạn</label>
                      </div>
                      <div class="text-center mt-4">
                          <button class="btn btn-primary" id="searchButton">Tính toán <i class="fa fa-search ml-1"></i></button>
                          <button class="btn btn-outline-secondary" id="reloadBtn" type="button" title="Tải lại dữ liệu">
                              <i class="fa fa-refresh ml-1"></i> Tải lại
                          </button>
                      </div>

                      <!--Status / Stats-->
                      <div id="statusBar" class="stats-bar text-center mt-4" style="display:none;"></div>

                      <!--Loading-->
                      <div id="loading" class="text-center my-3" style="display:none;">
                          <div class="spinner-border spinner-border-sm text-primary" role="status">
                              <span class="sr-only">Đang tải...</span>
                          </div>
                          <span class="ml-2 text-muted">Đang tải dữ liệu...</span>
                      </div>

                      <!--Error-->
                      <div id="errorBox" class="alert alert-danger mt-3" style="display:none;" role="alert"></div>

                      <!--Progress bar-->
                      <div class="progress-wrapper">
                          <div id="hh"></div>
                          <div id="progress">
                              <div id="bar"></div>
                          </div>
                      </div>

                      <!--Result-->
                      <div id="Result"></div>
                  </div>
                  <div class="col-lg-3 col-md-12"></div>
              </div>
          </section>

      </div>
  </main>
  <!--Main layout-->

  <my-footer></my-footer>

  <!-- SCRIPTS -->
  <script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="js/popper.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.min.js"></script>
  <script type="text/javascript" src="js/mdb.min.js"></script>
  <script src="js/modules/header.js" defer></script>
  <script src="js/modules/footer.js" defer></script>

  <script>
  // ===== Config =====
  const SHEET_ID = '1wZEUSJfXwrnG-fyONaRb6Izmm9oWU3xTS5xZt_9bqnY';
  const SHEET_GID = '2030852021';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}`;
  const COL_HO_TEN = 2; // Column C: Họ và tên

  // ===== State =====
  let memberArray = [];
  let jsonpTimeout = null;

  // ===== DOM refs =====
  const $loading = $('#loading');
  const $errorBox = $('#errorBox');
  const $statusBar = $('#statusBar');
  const $reloadBtn = $('#reloadBtn');

  // ===== Helpers =====
  function getCellValue(row, idx) {
    const cell = row.c && row.c[idx];
    if (!cell) return '';
    return cell.v == null ? '' : String(cell.v);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>')
      .replace(/"/g, '"')
      .replace(/'/g, '&#039;');
  }

  function nonAccentVietnamese(str) {
    str = (str || '').toLowerCase();
    str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
    str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
    str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
    str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
    str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
    str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
    str = str.replace(/đ/g, "d");
    str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, "");
    str = str.replace(/\u02C6|\u0306|\u031B/g, "");
    return str;
  }

  function normalizeString(str) {
    return nonAccentVietnamese(str).toUpperCase();
  }

  // ===== Data loading (JSONP to bypass CORS) =====
  function loadData() {
    $loading.show();
    $errorBox.hide();
    $statusBar.hide();

    const callbackName = 'ghepdoiCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

    window[callbackName] = function (data) {
      clearTimeout(jsonpTimeout);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      const scriptEl = document.getElementById('sheet-jsonp-script');
      if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);

      try {
        if (!data || data.status !== 'ok' || !data.table) {
          throw new Error('Sheet trả về trạng thái: ' + (data && data.status ? data.status : 'unknown'));
        }

        memberArray = (data.table.rows || [])
          .map(row => getCellValue(row, COL_HO_TEN).trim())
          .filter(name => name !== '');

        $loading.hide();
        $statusBar.html(
          `<i class="fa fa-database"></i> Đã tải <strong>${memberArray.length}</strong> thành viên. ` +
          `Bắt đầu nhập tên để ghép đôi.`
        ).show();
      } catch (err) {
        $loading.hide();
        $errorBox.html(
          '<i class="fa fa-exclamation-triangle"></i> ' +
          'Không xử lý được dữ liệu: ' + escapeHtml(err.message)
        ).show();
      }
    };

    jsonpTimeout = setTimeout(() => {
      if (window[callbackName]) {
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        const scriptEl = document.getElementById('sheet-jsonp-script');
        if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
        $loading.hide();
        $errorBox.html(
          '<i class="fa fa-exclamation-triangle"></i> ' +
          'Quá thời gian chờ phản hồi từ Google Sheets (15s).<br>' +
          '<small>Kiểm tra kết nối mạng hoặc thử lại sau.</small>'
        ).show();
      }
    }, 15000);

    const script = document.createElement('script');
    script.id = 'sheet-jsonp-script';
    script.src = `${SHEET_URL}&tqx=out:json;responseHandler:${callbackName}`;
    script.onerror = function () {
      clearTimeout(jsonpTimeout);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      $loading.hide();
      $errorBox.html(
        '<i class="fa fa-exclamation-triangle"></i> ' +
        'Không tải được dữ liệu từ Google Sheets.<br>' +
        '<small>Có thể sheet đã bị chuyển sang riêng tư, hoặc URL không đúng.</small>'
      ).show();
    };
    document.body.appendChild(script);
  }

  // ===== Autocomplete =====
  // Reads from global `memberArray` (populated async by JSONP).
  function autocomplete(inp) {
    let currentFocus;
    inp.addEventListener("input", function (e) {
      const a = document.getElementById(this.id + "autocomplete-list");
      if (a) a.parentNode.removeChild(a);
      const val = this.value;
      if (!val) return false;
      currentFocus = -1;
      const list = document.createElement("DIV");
      list.setAttribute("id", this.id + "autocomplete-list");
      list.setAttribute("class", "autocomplete-items");
      this.parentNode.appendChild(list);
      // Read from global memberArray (always up-to-date)
      for (let i = 0; i < memberArray.length; i++) {
        if (normalizeString(memberArray[i]).includes(normalizeString(val))) {
          const idx = normalizeString(memberArray[i]).indexOf(normalizeString(val));
          const item = document.createElement("DIV");
          item.innerHTML = escapeHtml(memberArray[i].substr(0, idx));
          item.innerHTML += "<strong>" + escapeHtml(memberArray[i].substr(idx, val.length)) + "</strong>";
          item.innerHTML += escapeHtml(memberArray[i].substr(idx + val.length));
          item.innerHTML += "<input type='hidden' value='" + escapeHtml(memberArray[i]) + "'>";
          item.addEventListener("click", function (e) {
            inp.value = this.getElementsByTagName("input")[0].value;
            const a = document.getElementById(inp.id + "autocomplete-list");
            if (a) a.parentNode.removeChild(a);
          });
          list.appendChild(item);
        }
      }
    });

    inp.addEventListener("keydown", function (e) {
      let x = document.getElementById(this.id + "autocomplete-list");
      if (x) x = x.getElementsByTagName("div");
      if (e.keyCode == 40) { // down
        currentFocus++;
        addActive(x);
      } else if (e.keyCode == 38) { // up
        currentFocus--;
        addActive(x);
      } else if (e.keyCode == 13) { // enter
        e.preventDefault();
        if (currentFocus > -1 && x) x[currentFocus].click();
      }
    });

    function addActive(x) {
      if (!x) return false;
      removeActive(x);
      if (currentFocus >= x.length) currentFocus = 0;
      if (currentFocus < 0) currentFocus = (x.length - 1);
      x[currentFocus].classList.add("autocomplete-active");
    }
    function removeActive(x) {
      for (let i = 0; i < x.length; i++) {
        x[i].classList.remove("autocomplete-active");
      }
    }

    document.addEventListener("click", function (e) {
      const items = document.getElementsByClassName("autocomplete-items");
      for (let i = 0; i < items.length; i++) {
        if (e.target != items[i] && e.target != inp) {
          if (items[i].parentNode) items[i].parentNode.removeChild(items[i]);
        }
      }
    });
  }

  // ===== Pairing calculation =====
  let width = 0;
  let id = null;

  function frame() {
    const hh = document.getElementById("hh");
    const bar = document.getElementById("bar");
    if (width >= 1000) {
      hh.innerHTML = 'Xong!';
      const ratio = parseInt(Math.random() * 100);
      const yourName = document.getElementById("searchInput1").value;
      const crushName = document.getElementById("searchInput2").value;
      document.getElementById("Result").innerHTML =
        `<div class="ratio-display">${ratio}%</div>` +
        `<p>Xác suất để <strong>${escapeHtml(yourName)}</strong> và <strong>${escapeHtml(crushName)}</strong> hợp nhau là <strong>${ratio}%</strong></p>`;
      clearInterval(id);
    } else {
      width += 3;
      bar.style.width = (width / 10) + '%';
      bar.innerHTML = parseInt(width / 10) + '%';
      if (width < 300) {
        hh.innerHTML = 'Đang lấy thông tin';
      } else if (width < 600) {
        width += 3;
        hh.innerHTML = 'Đang phân tích dữ liệu';
      } else if (width < 900) {
        width += 5;
        hh.innerHTML = 'Đang tính toán';
      } else {
        width += 4;
        hh.innerHTML = 'Đang tải kết quả';
      }
    }
  }

  // ===== Events =====
  document.getElementById("searchButton").addEventListener("click", function () {
    const yourName = document.getElementById("searchInput1").value;
    const crushName = document.getElementById("searchInput2").value;
    const Result = document.getElementById("Result");

    if (!yourName || !crushName) {
      document.getElementById("hh").innerHTML = "Vui lòng nhập đầy đủ họ tên";
      return;
    }

    if (memberArray.length === 0) {
      Result.innerHTML = '<div class="alert alert-warning">Dữ liệu chưa sẵn sàng, vui lòng đợi.</div>';
      return;
    }

    // Check if crush is in member list
    const isInMember = memberArray.some(name =>
      normalizeString(name).includes(normalizeString(crushName))
    );

    if (!isInMember) {
      Result.innerHTML = '<div class="alert alert-info"><strong>Bạn yêu ngoài CLB à?</strong></div>';
      return;
    }

    Result.innerHTML = '';
    clearInterval(id);
    width = 0;
    id = setInterval(frame, 50);
  });

  $reloadBtn.on('click', loadData);

  // ===== Init =====
  $(document).ready(function () {
    loadData();
    autocomplete(document.getElementById("searchInput1"));
    autocomplete(document.getElementById("searchInput2"));
  });
  </script>

</body>

</html>
