  // ===== Helpers =====
  function getCellValue(row, idx) {
    const cell = row.c && row.c[idx];
    if (!cell) return '';
    return cell.v == null ? '' : String(cell.v);
  }

  function formatDate(dateStr) {
    // Google returns "Date(YYYY,M,D)" for date columns
    const m = /Date\((\d+),(\d+),(\d+)\)/.exec(dateStr);
    if (!m) return dateStr || '';
    const yyyy = m[1];
    const mm = String(parseInt(m[2], 10) + 1).padStart(2, '0');
    const dd = String(parseInt(m[3], 10)).padStart(2, '0');
    return `${dd}/${mm}/${yyyy}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>')
      .replace(/"/g, '"')
      .replace(/'/g, '&#039;');
  }

  function normalize(s) {
    return (s || '')
      .toLowerCase()
      .normalize('NFC')
      .trim();
  }

  // ===== Belt rendering =====
  // Parse rank text like "Cấp 10", "4 đẳng", "3 d?ng" and return belt info.
  function parseRank(rankText) {
    if (!rankText) return null;
    // Strip diacritics for robust matching (handles mojibake too)
    const text = nonAccentVietnamese(rankText.toLowerCase());

    // Geup (cấp): cap 10 -> white, cap 1 -> red 4 stripes
    let m = text.match(/(?:cap|cap)\s*(\d+)/);
    if (m) {
      const cap = parseInt(m[1], 10);
      const geupBelts = {
        10: { color: 'white',  stripes: 0 },
        9:  { color: 'white',  stripes: 1 },
        8:  { color: 'white',  stripes: 2 },
        7:  { color: 'yellow', stripes: 0 },
        6:  { color: 'blue',   stripes: 1 },
        5:  { color: 'blue',   stripes: 2 },
        4:  { color: 'red',    stripes: 1 },
        3:  { color: 'red',    stripes: 2 },
        2:  { color: 'red',    stripes: 3 },
        1:  { color: 'red',    stripes: 4 },
      };
      if (geupBelts[cap]) {
        return { ...geupBelts[cap], label: 'Cấp ' + cap };
      }
    }

    // Dan (đẳng): dang 1 -> black 1 stripe, dang 2 -> black 2 stripes, ...
    m = text.match(/(\d+)\s*(?:dang|dang)/);
    if (m) {
      const dang = parseInt(m[1], 10);
      if (dang >= 1) {
        return { color: 'black', stripes: dang, label: 'Đẳng ' + dang };
      }
    }

    return null;
  }

  // Strip Vietnamese diacritics (for robust matching)
  function nonAccentVietnamese(str) {
    str = (str || '').toLowerCase();
    str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
    str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
    str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
    str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
    str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
    str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
    str = str.replace(/đ/g, "d");
    str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, "");
    str = str.replace(/\u02C6|\u0306|\u031B/g, "");
    return str;
  }

  function renderBelt(rankText) {
    const belt = parseRank(rankText);
    if (!belt) {
      // Fallback: just show the text
      return `<span class="rank-badge mb-2 d-inline-flex belt-black"><span class="belt-label">${escapeHtml(rankText)}</span></span>`;
    }
    let stripesHtml = '';
    if (belt.stripes > 0) {
      const stripeTags = Array(belt.stripes).fill('<span class="stripe"></span>').join('');
      stripesHtml = `<span class="belt-stripes">${stripeTags}</span>`;
    }
    return `<span class="rank-badge mb-2 d-inline-flex belt-${belt.color}">
      <span class="belt-label">${escapeHtml(belt.label)}</span>
      ${stripesHtml}
    </span>`;
  }

  // ===== Extra columns =====
  // Detect columns that are NOT in the predefined COL map.
  // These are dynamically added columns in the sheet that we render as extra fields.
  function getExtraColumnIndices() {
    const predefined = new Set(Object.values(COL));
    const extras = [];
    for (let i = 0; i < colLabels.length; i++) {
      if (!predefined.has(i)) {
        const label = (colLabels[i] || '').trim();
        if (label) extras.push({ idx: i, label: label });
      }
    }
    return extras;
  }

  // Pick a Font Awesome icon based on column label keywords (Vietnamese-aware)
  function pickIconForLabel(label) {
    const text = nonAccentVietnamese((label || '').toLowerCase());
    if (/ngay|date|sinh/.test(text)) return 'fa-calendar-alt';
    if (/sdt|phone|dien thoai/.test(text)) return 'fa-phone';
    if (/email|mail/.test(text)) return 'fa-envelope';
    if (/dia chi|address/.test(text)) return 'fa-map-marker-alt';
    if (/ghi chu|note/.test(text)) return 'fa-sticky-note';
    if (/ma|code|id/.test(text)) return 'fa-id-badge';
    if (/clb|club/.test(text)) return 'fa-flag';
    if (/ten|name/.test(text)) return 'fa-user';
    if (/gioi tinh|gender/.test(text)) return 'fa-venus-mars';
    if (/cap|dang|trinh do/.test(text)) return 'fa-graduation-cap';
    if (/hieu luc|status|trang thai/.test(text)) return 'fa-check-circle';
    return 'fa-info-circle';
  }

  // ===== Data loading (JSONP to bypass CORS) =====
  // Generic JSONP loader. Returns a Promise that resolves with the parsed data.
  function jsonpLoad(url) {
    return new Promise((resolve, reject) => {
      const callbackName = 'sheetCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const scriptId = 'sheet-jsonp-' + callbackName;
      let timeoutId = null;

      function cleanup() {
        if (timeoutId) clearTimeout(timeoutId);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        const scriptEl = document.getElementById(scriptId);
        if (scriptEl && scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
      }

      timeoutId = setTimeout(() => {
        cleanup();
        reject(new Error('Quá thời gian chờ phản hồi (15s)'));
      }, 15000);

      window[callbackName] = function (data) {
        cleanup();
        if (!data || data.status !== 'ok' || !data.table) {
          reject(new Error('Sheet trả về trạng thái: ' + (data && data.status ? data.status : 'unknown')));
          return;
        }
        resolve(data);
      };

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = `${url}&tqx=out:json;responseHandler:${callbackName}`;
      script.onerror = function () {
        cleanup();
        reject(new Error('Không tải được dữ liệu (lỗi mạng hoặc sheet riêng tư)'));
      };
      document.body.appendChild(script);
    });
  }

  // Build registration map from a registration sheet's data, using the given column map.
  // Returns a Map keyed by normalize(name)+'|'+dob.
  function buildRegistrationMap(data, colMap) {
    const map = new Map();
    if (!data || !data.table || !data.table.rows) return map;
    data.table.rows.forEach(row => {
      if (!row.c) return;
      const name = getCellValue(row, colMap.HO_TEN);
      const dob = formatDate(getCellValue(row, colMap.NGAY_SINH));
      if (!name) return;
      const key = normalize(name);
      map.set(key, {
        name: name,
        dob: dob,
        email: getCellValue(row, colMap.EMAIL),
        phone: getCellValue(row, colMap.SDT),
        facebook: getCellValue(row, colMap.FACEBOOK),
        school: getCellValue(row, colMap.TRUONG),
        source: getCellValue(row, colMap.NGUON_BIET),
        learned: getCellValue(row, colMap.DA_HOC),
        certificate: getCellValue(row, colMap.CHUNG_NHAN),
        expectations: getCellValue(row, colMap.MONG_MUON),
        studentId: getCellValue(row, colMap.MA_SV),
        note: colMap.NOTE != null ? getCellValue(row, colMap.NOTE) : ''
      });
    });
    return map;
  }

  // Build belt rank map from exam results sheet data.
  // Only includes "Đạt" (passed) results. Existing keys in targetMap are NOT
  // overwritten, so Q3 (loaded first) has priority over Q2.
  function buildBeltRankMap(data, targetMap) {
    if (!data || !data.table || !data.table.rows) return;
    data.table.rows.forEach(row => {
      if (!row.c) return;
      const name = getCellValue(row, EXAM_COL.HO_TEN);
      const dob = formatDate(getCellValue(row, EXAM_COL.NGAY_SINH));
      const capDangKy = getCellValue(row, EXAM_COL.CAP_DANG_KY);
      const ketQua = getCellValue(row, EXAM_COL.KET_QUA);
      if (!name || !capDangKy) return;
      // Only consider "Đạt" (passed) results
      if (!ketQua || !/^đạt$/i.test(ketQua.trim())) return;
      const key = normalize(name) + '|' + dob;
      if (!targetMap.has(key)) {
        targetMap.set(key, capDangKy);
      }
    });
  }

  // Merge source map into target map. For matching keys, fill in any missing
  // (empty) fields from source without overwriting existing data.
  function mergeRegistrationMaps(target, source) {
    source.forEach((value, key) => {
      const existing = target.get(key);
      if (existing) {
        const merged = { ...existing };
        Object.keys(value).forEach(k => {
          if (value[k] && !existing[k]) {
            merged[k] = value[k];
          }
        });
        target.set(key, merged);
      } else {
        target.set(key, value);
      }
    });
  }

  async function loadData() {
    $loading.show();
    $errorBox.hide();
    $results.empty();
    $statusBar.hide();

    try {
      // Load member sheet (required)
      const memberData = await jsonpLoad(SHEET_URL);

      colLabels = (memberData.table.cols || []).map(c => (c.label || '').trim());
      allRows = (memberData.table.rows || []).filter(r => {
        return r.c && r.c.some(cell => cell && cell.v != null && String(cell.v).trim() !== '');
      });
      extraColumns = getExtraColumnIndices();

      // Load registration sheets (optional - don't fail if unavailable)
      let regCount = 0;
      registrationMap = new Map();
      try {
        const regData2 = await jsonpLoad(SHEET2_URL);
        const map2 = buildRegistrationMap(regData2, SHEET2_COL);
        regCount += map2.size;
        map2.forEach((v, k) => registrationMap.set(k, v));
      } catch (regErr) {
        console.warn('Registration sheet 1 unavailable:', regErr);
      }
      try {
        const regData3 = await jsonpLoad(SHEET3_URL);
        const map3 = buildRegistrationMap(regData3, SHEET3_COL);
        regCount += map3.size;
        mergeRegistrationMaps(registrationMap, map3);
      } catch (regErr) {
        console.warn('Registration sheet 2 unavailable:', regErr);
      }
      try {
        const regData4 = await jsonpLoad(SHEET4_URL);
        const map4 = buildRegistrationMap(regData4, SHEET4_COL);
        regCount += map4.size;
        mergeRegistrationMaps(registrationMap, map4);
      } catch (regErr) {
        console.warn('Registration sheet 3 (GEN16) unavailable:', regErr);
      }
      // Load additional registration sheets (5-10)
      const extraSheets = [
        { url: SHEET5_URL,  colMap: SHEET5_COL,  name: 'sheet 4' },
        { url: SHEET6_URL,  colMap: SHEET6_COL,  name: 'sheet 5' },
        { url: SHEET7_URL,  colMap: SHEET7_COL,  name: 'sheet 6' },
        { url: SHEET8_URL,  colMap: SHEET8_COL,  name: 'sheet 7' },
        { url: SHEET9_URL,  colMap: SHEET9_COL,  name: 'sheet 8' },
        { url: SHEET10_URL, colMap: SHEET10_COL, name: 'sheet 9' }
      ];
      for (const s of extraSheets) {
        try {
          const data = await jsonpLoad(s.url);
          const m = buildRegistrationMap(data, s.colMap);
          regCount += m.size;
          mergeRegistrationMaps(registrationMap, m);
        } catch (e) {
          console.warn(`Registration ${s.name} unavailable:`, e);
        }
      }

      // Load exam result sheets (Q3 first for priority, Q2 as fallback)
      let examCount = 0;
      beltRankMap = new Map();
      try {
        const examData3 = await jsonpLoad(SHEET_Q3_URL);
        buildBeltRankMap(examData3, beltRankMap);
        examCount = beltRankMap.size;
      } catch (examErr) {
        console.warn('Q3/2026 exam sheet unavailable:', examErr);
      }
      try {
        const examData2 = await jsonpLoad(SHEET_Q2_URL);
        buildBeltRankMap(examData2, beltRankMap);
      } catch (examErr) {
        console.warn('Q2/2026 exam sheet unavailable:', examErr);
      }

      $loading.hide();
      let statusHtml =
        `<i class="fas fa-database"></i> Đã tải <strong>${allRows.length}</strong> hội viên`;
      if (regCount > 0) {
        statusHtml += ` và <strong>${regCount}</strong> hồ sơ đăng ký`;
      }
      if (examCount > 0) {
        statusHtml += `. Cập nhật <strong>${examCount}</strong> cấp đai từ kết quả thi`;
      }
      statusHtml += `. Nhập tên và/hoặc năm sinh để tìm kiếm.`;
      if (extraColumns.length > 0) {
        const labels = extraColumns.map(c => escapeHtml(c.label)).join(', ');
        statusHtml +=
          `<br><small class="text-muted"><i class="fas fa-puzzle-piece"></i> ` +
          `Cột mở rộng (${extraColumns.length}): ${labels}</small>`;
      }
      $statusBar.html(statusHtml).show();
      $searchInput.focus();
    } catch (err) {
      $loading.hide();
      $errorBox.html(
        '<i class="fas fa-exclamation-triangle"></i> ' +
        'Không tải được dữ liệu: ' + escapeHtml(err.message) +
        '<br><small>Kiểm tra kết nối mạng hoặc thử lại sau.</small>'
      ).show();
    }
  }

  // ===== Search =====
  function performSearch() {
    const query = normalize($searchInput.val());
    const yearQuery = $searchYearInput.val().trim();
    $errorBox.hide();

    if (!query && !yearQuery) {
      $results.html(
        '<div class="col-12 text-center text-muted my-4">' +
        '<i class="fas fa-info-circle"></i> Vui lòng nhập tên hoặc năm sinh để tìm kiếm.' +
        '</div>'
      );
      return;
    }

    if (allRows.length === 0 && registrationMap.size === 0) {
      $results.html(
        '<div class="col-12 text-center text-muted my-4">' +
        '<i class="fas fa-hourglass-half"></i> Dữ liệu chưa sẵn sàng, vui lòng đợi.' +
        '</div>'
      );
      return;
    }

    // Helper: check if a (name, dob) pair matches the query
    function matchesQuery(name, dob) {
      const year = dob ? dob.split('/').pop() : '';
      const nameMatch = !query || name.includes(query);
      const yearMatch = !yearQuery || year === yearQuery;
      return nameMatch && yearMatch;
    }

    // Search in member sheet
    const matches = [];
    const matchedKeys = new Set();

    allRows.forEach(row => {
      const name = normalize(getCellValue(row, COL.HO_TEN));
      const dob = formatDate(getCellValue(row, COL.NGAY_SINH));
      if (matchesQuery(name, dob)) {
        matches.push(row);
        matchedKeys.add(name);
      }
    });

    // Also search in registration-only entries (not already matched with member sheet)
    registrationMap.forEach((reg, regName) => {
      if (matchedKeys.has(regName)) return;
      if (matchesQuery(regName, '')) {
        matches.push({ _isRegistrationOnly: true, _regData: reg });
      }
    });

    const displayQuery = query || ('năm ' + yearQuery);
    renderResults(matches, displayQuery);
  }

  // ===== Render =====
  // Build registration fields HTML for a member card
  function buildRegistrationFieldsHtml(reg, existingSdt, existingEmail) {
    if (!reg) return '';
    const items = [];
    // Only show email/phone from registration if not already in member sheet
    if (reg.email && !existingEmail) {
      items.push(`<div class="field"><i class="fas fa-envelope"></i><strong>Email:</strong> <a href="mailto:${escapeHtml(reg.email)}">${escapeHtml(reg.email)}</a></div>`);
    }
    if (reg.phone && !existingSdt) {
      items.push(`<div class="field"><i class="fas fa-phone"></i><strong>SĐT:</strong> <a href="tel:${escapeHtml(reg.phone)}">${escapeHtml(reg.phone)}</a></div>`);
    }
    if (reg.facebook) {
      const fbUrl = reg.facebook;
      const fbDisplay = fbUrl.length > 45 ? fbUrl.substring(0, 45) + '...' : fbUrl;
      items.push(`<div class="field"><i class="fab fa-facebook"></i><strong>Facebook:</strong> <a href="${escapeHtml(fbUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(fbDisplay)}</a></div>`);
    }
    if (reg.school) {
      items.push(`<div class="field"><i class="fas fa-university"></i><strong>Trường:</strong> ${escapeHtml(reg.school)}</div>`);
    }
    if (reg.studentId) {
      items.push(`<div class="field"><i class="fas fa-id-badge"></i><strong>Mã SV:</strong> ${escapeHtml(reg.studentId)}</div>`);
    }
    if (reg.learned) {
      items.push(`<div class="field"><i class="fas fa-history"></i><strong>Đã học TK:</strong> ${escapeHtml(reg.learned)}</div>`);
    }
    if (reg.source) {
      items.push(`<div class="field"><i class="fas fa-bullhorn"></i><strong>Biết CLB qua:</strong> ${escapeHtml(reg.source)}</div>`);
    }
    if (reg.expectations) {
      items.push(`<div class="field"><i class="fas fa-star"></i><strong>Mong muốn:</strong> ${escapeHtml(reg.expectations)}</div>`);
    }
    if (reg.note) {
      items.push(`<div class="field"><i class="fas fa-sticky-note"></i><strong>Ghi chú:</strong> ${escapeHtml(reg.note)}</div>`);
    }
    if (items.length === 0) return '';
    return `<hr class="my-2"><div class="field-section-title"><i class="fas fa-clipboard-list"></i> Thông tin đăng ký</div>` + items.join('');
  }

  function renderResults(matches, query) {
    $results.empty();

    if (matches.length === 0) {
      $results.html(
        '<div class="col-12 text-center my-4">' +
        '<div class="alert alert-warning">' +
        '<i class="fas fa-search"></i> Không tìm thấy kết quả nào với "<strong>' +
        escapeHtml(query) + '</strong>".' +
        '</div></div>'
      );
      return;
    }

    $results.append(
      '<div class="col-12 mb-3">' +
      '<strong><i class="fas fa-list"></i> Tìm thấy ' + matches.length + ' kết quả</strong>' +
      '</div>'
    );

    matches.forEach(row => {
      if (row._isRegistrationOnly) {
        renderRegistrationOnlyCard(row._regData);
      } else {
        renderMemberCard(row);
      }
    });
  }

  function renderMemberCard(row) {
    const hoTen    = getCellValue(row, COL.HO_TEN);
    const maHV     = getCellValue(row, COL.MA_HV);
    const ngaySinh = formatDate(getCellValue(row, COL.NGAY_SINH));
    const gioiTinh = getCellValue(row, COL.GIOI_TINH);
    const sdt      = getCellValue(row, COL.SDT);
    const email    = getCellValue(row, COL.EMAIL);
    const clb      = getCellValue(row, COL.CLB);
    const capDai   = getCellValue(row, COL.CAP_DAI);
    const diaChi   = getCellValue(row, COL.DIA_CHI);
    const hieuLuc  = getCellValue(row, COL.HIEU_LUC);
    const trinhDo  = getCellValue(row, COL.TRINH_DO);

    // Look up registration data by normalized name (registrationMap uses name-only key)
    const regKey = normalize(hoTen);
    const reg = registrationMap.get(regKey);
    const regFieldsHtml = buildRegistrationFieldsHtml(reg, sdt, email);

    // Look up updated belt rank from exam results (Q3/Q2 2026)
    const examKey = normalize(hoTen) + '|' + ngaySinh;
    const updatedCapDai = beltRankMap.get(examKey) || capDai;

    // Build extra fields HTML from dynamically detected columns
    let extraFieldsHtml = '';
    if (extraColumns.length > 0) {
      const items = extraColumns.map(({ idx, label }) => {
        const value = formatDate(getCellValue(row, idx));
        if (!value) return '';
        const icon = pickIconForLabel(label);
        return `<div class="field"><i class="fas ${icon}"></i><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</div>`;
      }).filter(Boolean);
      if (items.length > 0) {
        extraFieldsHtml =
          `<hr class="my-2">` +
          `<div class="field-section-title"><i class="fas fa-puzzle-piece"></i> Thông tin khác</div>` +
          items.join('');
      }
    }

    const card = `
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="card member-card h-100">
          <div class="card-body">
            <h5 class="card-title mb-1">
              <i class="fas fa-user"></i> ${escapeHtml(hoTen) || '(chưa có tên)'}
            </h5>
              ${updatedCapDai ? renderBelt(updatedCapDai) : ''}
            <hr class="my-2">
            ${maHV ? `<div class="field"><i class="fas fa-id-badge"></i><strong>Mã HV:</strong> ${escapeHtml(maHV)}</div>` : ''}
            ${ngaySinh ? `<div class="field"><i class="fas fa-birthday-cake"></i><strong>Ngày sinh:</strong> ${escapeHtml(ngaySinh)}</div>` : ''}
            ${gioiTinh ? `<div class="field"><i class="fas fa-venus-mars"></i><strong>Giới tính:</strong> ${escapeHtml(gioiTinh)}</div>` : ''}
            ${sdt ? `<div class="field"><i class="fas fa-phone"></i><strong>SĐT:</strong> <a href="tel:${escapeHtml(sdt)}">${escapeHtml(sdt)}</a></div>` : ''}
            ${email ? `<div class="field"><i class="fas fa-envelope"></i><strong>Email:</strong> <a href="mailto:${escapeHtml(email)}">${escapeHtml(email)}</a></div>` : ''}
            ${trinhDo ? `<div class="field"><i class="fas fa-graduation-cap"></i><strong>Trình độ:</strong> ${escapeHtml(trinhDo)}</div>` : ''}
            ${clb ? `<div class="field"><i class="fas fa-flag"></i><strong>CLB:</strong> ${escapeHtml(clb)}</div>` : ''}
            ${diaChi ? `<div class="field"><i class="fas fa-map-marker-alt"></i><strong>Địa chỉ:</strong> ${escapeHtml(diaChi)}</div>` : ''}
            ${hieuLuc ? `<div class="field"><i class="fas fa-check-circle"></i><strong>Hiệu lực:</strong> ${escapeHtml(hieuLuc)}</div>` : ''}
            ${regFieldsHtml}
            ${extraFieldsHtml}
          </div>
        </div>
      </div>
    `;
    $results.append(card);
  }

  function renderRegistrationOnlyCard(reg) {
    const regFieldsHtml = buildRegistrationFieldsHtml(reg, '', '');
    const card = `
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="card member-card h-100 member-card-registration">
          <div class="card-body">
            <h5 class="card-title mb-1">
              <i class="fas fa-user-plus"></i> ${escapeHtml(reg.name) || '(chưa có tên)'}
            </h5>
            <span class="badge badge-warning mb-2"><i class="fas fa-clock"></i> Đăng ký mới</span>
            <hr class="my-2">
            ${reg.dob ? `<div class="field"><i class="fas fa-birthday-cake"></i><strong>Ngày sinh:</strong> ${escapeHtml(reg.dob)}</div>` : ''}
            ${regFieldsHtml}
          </div>
        </div>
      </div>
    `;
    $results.append(card);
  }

  // ===== Events =====
  $searchBtn.on('click', performSearch);
  $reloadBtn.on('click', loadData);
  $searchInput.on('keypress', function (e) {
    if (e.which === 13) { performSearch(); $searchYearInput.focus(); }
  });
  $searchYearInput.on('keypress', function (e) {
    if (e.which === 13) performSearch();
  });
  $searchYearInput.on('input', function () {
    // Only allow digits, max 4 chars
    this.value = this.value.replace(/[^0-9]/g, '').substring(0, 4);
  });

  // ===== Init =====
  // (Auth gate at top of script already redirected if not authed)
  $(document).ready(function () {
    loadData();
  });
  </script>

</body>
